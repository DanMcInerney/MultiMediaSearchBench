[project]
name = "mmsb"
version = "0.1.0"
description = "MultiMediaSearchBench: how well AI agents, alone or with a search system, find things in the video, pictures and sound people keep"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# The bytes of the generated V7 week depend on these four: they are pinned to what the recorded pilot was written with.
dependencies = [
    "av==19.0.2",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "imageio-ffmpeg==0.7.0",
    "mcp>=2.2,<3",
    "anyio>=4.5",
    "pyarrow>=26.0.1",
    "pypdfium2>=5.15.2",
]

[project.optional-dependencies]
# MultimediaSearch, at the commit whose default model is d1-Omni-2B (the commit uv.lock pins as well)
mm = ["mms @ git+https://github.com/DanMcInerney/MultimediaSearch@7237e41c1677b32aee8189aac782c43d1324260d"]

[project.scripts]
mmsb = "mmsb.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
]
# mm runs d1 in the python that started its daemon, so a run of the mm system needs torch in this environment.
# transformers is pinned as in MultimediaSearch's pyproject: 5.22.1 breaks d1's `_lfm2_conv`.
mm-gpu = [
    "torch",
    "torchvision",
    "transformers==5.21.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "mmsb"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Four workers: a GPU run beside 12-worker suites hung the laptop's GPU driver and crashed Windows (MultimediaSearch, then called Multimem, 2026-10-30).
addopts = "-n 4 --dist loadgroup -m 'not slow and not paid and not gpu'"
